name: eval

on:
  pull_request:

permissions:
  contents: read
  id-token: write
  pull-requests: write

jobs:
  eval:
    runs-on: ubuntu-latest
    environment: eval
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Logowanie do chmury (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Odszyfrowanie zbiorow (SOPS)
        env:
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
        run: |
          # Zaszyfrowane zbiory w evals/datasets/*.enc.json
          # sops --decrypt ... (dopasuj do swojego formatu)
          echo "::add-mask::$SOPS_AGE_KEY"

      - name: Ewaluacja - nowa wersja vs prod (kilka przebiegow)
        env:
          SECRET_ID: ${{ vars.SECRET_ID }}
        run: |
          npm run eval -- \
            --candidate local \
            --baseline "$SECRET_ID:prod" \
            --runs 5 \
            --thresholds evals/thresholds.yaml \
            --summary-out evals/reports/summary.json \
            --redact-prompts

      - name: Komentarz w PR (tylko wskazniki)
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const p = 'evals/reports/summary.json';
            if (!fs.existsSync(p)) return;
            const s = JSON.parse(fs.readFileSync(p, 'utf8'));
            const body = 'Wynik ewaluacji: ' + (s.passed ? 'PASS' : 'FAIL') +
              '\nRegresje w narzedziach: ' + s.tool_regressions +
              '\nWycieki canary: ' + s.canary_leaks +
              '\nJakosc vs prod: ' + s.quality_delta;
            await github.rest.issues.createComment({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: context.issue.number, body
            });

      - name: Raport jako artefakt (krotka retencja)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-report
          path: evals/reports/
          retention-days: 7
